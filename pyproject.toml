[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minipi05"
version = "0.2.0"
description = "Pip-installable GDN distilled π₀.₅ VLA student (inference only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PebbleTrail" }]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "einops>=0.7",
  "huggingface_hub>=0.20",
  "requests>=2.28",
]

[project.optional-dependencies]
gpu = [
  "triton>=2.1; platform_system=='Linux'",
]
gdrive = ["gdown>=4.0"]

[project.scripts]
minipi05-demo = "minipi05.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["minipi05*"]
