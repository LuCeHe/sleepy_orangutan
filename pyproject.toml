[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepy-orangutan"
version = "0.4.0"
description = "Sleepy Orangutan — pip-installable GDN + RT distilled π₀.₅ VLA students (inference only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PebbleTrail" }]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "einops>=0.7",
  "huggingface_hub>=0.20",
  "requests>=2.28",
  "transformers>=4.38",
]

[project.optional-dependencies]
gpu = [
  "triton>=2.1; platform_system=='Linux'",
]
gdrive = ["gdown>=4.0"]

[project.scripts]
sleepy-orangutan-demo = "sleepy_orangutan.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sleepy_orangutan*"]

[tool.setuptools.package-data]
sleepy_orangutan = ["checkpoints_catalog.json"]